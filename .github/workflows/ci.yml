name: ci

on:
  push:
  pull_request:

jobs:
  # Secrets only. The personal-data denylist lives in the owner's private
  # overlay and runs locally from .githooks (tools/leak-check.js).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action: the action scans <first pushed>^..<last>,
      # which fails on a push that includes the root commit and then reports
      # "scanned ~0 bytes". This scans the whole history every time.
      - name: gitleaks (full history)
        env:
          GL_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          tarball="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GL_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Node unit tests
        shell: bash
        run: |
          rc=0
          for t in hooks/*.test.js skills/*/*.test.js tools/*.test.js; do
            out=$(node "$t" 2>&1) || rc=1
            echo "$t: $(echo "$out" | tail -1)"
          done
          exit $rc
      - name: Installer round trip (PowerShell 7)
        shell: pwsh
        run: ./install.test.ps1
      - name: Installer round trip (Windows PowerShell 5.1)
        shell: powershell
        run: ./install.test.ps1
      - name: Banner round trip
        shell: pwsh
        run: ./banner/install-banner.test.ps1
